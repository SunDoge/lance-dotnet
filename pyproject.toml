[project]
name = "lance-dotnet"
version = "0.1.0"
description = "Python tooling and integration tests for SunDoge.Lance"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.16.0",
    "pyarrow>=22.0.0",
    "pylance>=14.0.2",
    "typed-args>=0.9.0",
]

[dependency-groups]
s3 = [
    "boto3>=1.43.123",
    "moto[server]==5.1.15",
]
